name: Build HNStudio Musik AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --name "HNStudio-Musik-AI" app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HNStudio-Musik-AI-Windows
          path: dist/HNStudio-Musik-AI/
